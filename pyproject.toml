[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-contained-provider-trust-client"
version = "1.2.1"
description = "Trust client provider for AI-Contained"
requires-python = ">=3.12"
dependencies = [
    "ai-contained-core-mcp>=0.4.0",
    "ai-contained-provider-trust-server-client>=1.1.1",
]

# Fallback sources — only consulted when nothing else already satisfies the name in
# the current resolve (e.g. a sibling /opt/ directory in a monolithic image build).
[tool.uv.sources]
ai-contained-core-mcp = { url = "https://github.com/AI-Contained/ai-contained-base/archive/refs/tags/v0.4.0.zip", subdirectory = "packages/core-mcp" }
ai-contained-provider-trust-server-client = { url = "https://github.com/AI-Contained/ai-contained-provider-trust-server/archive/refs/tags/v1.1.1.zip", subdirectory = "packages/client" }
ai-contained-provider-trust-server-daemon = { url = "https://github.com/AI-Contained/ai-contained-provider-trust-server/archive/refs/tags/v1.1.1.zip", subdirectory = "packages/daemon" }

[project.optional-dependencies]
dev = [
    "ai-contained-provider-trust-server-daemon>=1.1.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-describe>=3.1",
    "assertpy>=1.1",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "focus: run only focused tests (use with -m focus)",
]

[project.entry-points."ai_contained.provider"]
trust_client = "ai_contained.provider.trust_client:provide"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]  # conflict with D211/D212

[tool.ruff.lint.isort]
known-first-party = ["ai_contained"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # no docstrings required in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_contained"]
